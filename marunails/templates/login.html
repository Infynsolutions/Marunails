<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maru Nails · Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #FAF6F0;
      --sand:    #EDE0D4;
      --brown:   #5C3826;
      --brown-d: #3E2418;
      --brown-m: #7A4F38;
      --muted:   #9E8878;
      --text:    #2A1F1A;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Monograma de fondo — watermark grande */
    .bg-watermark {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .bg-watermark img {
      width: min(90vw, 700px);
      height: min(90vw, 700px);
      object-fit: contain;
      opacity: 0.35;
    }

    /* Textura sutil */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 10%, rgba(224,210,196,0.4) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(196,172,150,0.25) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .card {
      background: rgba(250,246,240,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(92,56,38,0.12);
      border-radius: 20px;
      padding: 52px 44px 44px;
      box-shadow:
        0 4px 24px rgba(62,36,24,0.08),
        0 1px 0 rgba(255,255,255,0.8) inset;
    }

    /* Logo principal */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-area img {
      width: 200px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--sand);
      margin: 20px auto 0;
    }

    /* Form */
    .field-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(92,56,38,0.12);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 26px;
    }
    .tab {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 7px;
      background: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }
    .tab.active { background: var(--brown); color: var(--cream); }
    .panel { display: none; }
    .panel.active { display: block; }
    select.campo {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(92,56,38,0.18);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      margin-bottom: 18px;
      -webkit-appearance: none;
      appearance: none;
    }
    input.pin { letter-spacing: 0.6em; text-align: center; font-size: 1.3rem; }
    .vacio { font-size: 0.85rem; color: var(--muted); text-align: center; line-height: 1.6; }
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(92,56,38,0.18);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--brown-m);
      box-shadow: 0 0 0 3px rgba(92,56,38,0.08);
    }

    input[type="password"]::placeholder { color: var(--sand); }

    .btn-ingresar {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: var(--brown);
      border: none;
      border-radius: 10px;
      color: var(--cream);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-ingresar:hover { background: var(--brown-d); }
    .btn-ingresar:active { transform: scale(0.98); }

    .error-msg {
      margin-top: 16px;
      padding: 11px 16px;
      background: rgba(168,50,50,0.07);
      border: 1px solid rgba(168,50,50,0.2);
      border-radius: 8px;
      color: #7a2020;
      font-size: 0.82rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.78rem;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--brown); }

    /* Tagline debajo de la card */
    .tagline {
      text-align: center;
      margin-top: 28px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--brown-m);
      opacity: 0.6;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <!-- Monograma decorativo de fondo -->
  <div class="bg-watermark">
    <img src="{{ url_for('static', filename='Maru 2-04.PNG') }}" alt="">
  </div>

  <div class="login-wrap">
    <div class="card">

      <!-- Logo Maru Nails negro completo -->
      <div class="logo-area">
        <img src="{{ url_for('static', filename='Logotipo principal-03.PNG') }}" alt="Maru Nails">
        <div class="divider"></div>
      </div>

      <div class="tabs">
        <button type="button" class="tab {% if modo != 'admin' %}active{% endif %}" onclick="verTab('equipo')">Equipo</button>
        <button type="button" class="tab {% if modo == 'admin' %}active{% endif %}" onclick="verTab('admin')">Admin</button>
      </div>

      <div class="panel {% if modo != 'admin' %}active{% endif %}" id="panel-equipo">
        {% if equipo %}
        <form method="POST" onsubmit="recordar()">
          <input type="hidden" name="modo" value="equipo">
          <label class="field-label" for="colab">¿Quién sos?</label>
          <select class="campo" id="colab" name="colaboradora_id" required>
            <option value="">Elegí tu nombre</option>
            {% for c in equipo %}
            <option value="{{ c.id }}" {% if colab_sel == c.id|string %}selected{% endif %}>{{ c.nombre|title }}</option>
            {% endfor %}
          </select>
          <label class="field-label" for="pin">PIN</label>
          <input type="password" class="pin" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}"
                 maxlength="4" autocomplete="current-password" placeholder="····" required>
          <button type="submit" class="btn-ingresar">Ver la agenda</button>
        </form>
        {% else %}
        <p class="vacio">Todavía nadie del equipo tiene PIN.<br>La encargada lo carga en Admin → Equipo.</p>
        {% endif %}
      </div>

      <div class="panel {% if modo == 'admin' %}active{% endif %}" id="panel-admin">
        <form method="POST">
          <input type="hidden" name="modo" value="admin">
          <label class="field-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="············">
          <button type="submit" class="btn-ingresar">Ingresar al panel</button>
        </form>
      </div>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <a href="{{ url_for('salon') }}" class="back-link">← Volver al salón</a>
    </div>

    <p class="tagline">beauty & well being balance</p>
  </div>
  <script>
    function verTab(modo) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (modo === 'equipo')));
      document.getElementById('panel-equipo').classList.toggle('active', modo === 'equipo');
      document.getElementById('panel-admin').classList.toggle('active', modo === 'admin');
      const foco = modo === 'admin' ? 'password' : (document.getElementById('colab')?.value ? 'pin' : 'colab');
      document.getElementById(foco)?.focus();
    }
    // Cada chica usa su celular: recordar su nombre para que solo ponga el PIN
    function recordar() {
      try { localStorage.setItem('maru_colab', document.getElementById('colab').value); } catch (e) {}
    }
    (function () {
      const sel = document.getElementById('colab');
      if (!sel) return;
      try {
        const guardada = localStorage.getItem('maru_colab');
        if (!sel.value && guardada && [...sel.options].some(o => o.value === guardada)) sel.value = guardada;
      } catch (e) {}
      if (document.getElementById('panel-equipo').classList.contains('active'))
        document.getElementById(sel.value ? 'pin' : 'colab').focus();
    })();
  </script>

</body>
</html>
